name: flirt-data-pack tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  flirt-data-pack-lint:
    name: flirt-data-pack lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: "3.12"

    - name: Check formatting
      run: uvx ruff format --check plugins/flirt-data-pack

    - name: Check lints
      run: uvx ruff check plugins/flirt-data-pack

    - name: Check plugin metadata
      run: uvx --from ida-hcli hcli plugin lint plugins/flirt-data-pack

  flirt-data-pack-unit-tests:
    name: flirt-data-pack unit tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv --seed
        uv pip install pytest

    - name: Run tests that do not need IDA
      run: uv run --no-project python -m pytest plugins/flirt-data-pack/tests -v

  flirt-data-pack-idalib-tests:
    name: flirt-data-pack idalib tests on IDA ${{ matrix.ida-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
      IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        ida-version: ["9.2", "latest"]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv --seed
        uv pip install idapro pytest

    - name: Install IDA ${{ matrix.ida-version }}
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      shell: bash
      run: |
        uv run --with ida-hcli hcli \
          ida install \
          --download-id "ida-pro:${{ matrix.ida-version }}" \
          --license-id "${IDA_LICENSE_ID}" \
          --install-dir="${{ runner.temp }}/app/ida" \
          --accept-eula \
          --set-default \
          --yes

    - name: Run idalib tests
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      run: uv run --no-project python -m pytest plugins/flirt-data-pack/tests -v
      env:
        IDADIR: ${{ runner.temp }}/app/ida
