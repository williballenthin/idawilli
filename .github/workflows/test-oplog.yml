name: oplog tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  oplog-tests:
    name: oplog tests on IDA ${{ matrix.ida.version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        ida:
          - version: "9.2"
            idapyswitch: "/idapyswitch"
          - version: "latest"
            idapyswitch: "/idapyswitch"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv --seed
        uv pip install idapro ida-domain pydantic pytest

    - name: Install IDA ${{ matrix.ida.version }}
      shell: bash
      run: |
        uv run --with ida-hcli hcli \
          ida install \
          --download-id "ida-pro:${{ matrix.ida.version }}" \
          --license-id "${IDA_LICENSE_ID}" \
          --install-dir="${{ runner.temp }}/app/ida" \
          --accept-eula \
          --set-default \
          --yes
      env:
        HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

    - name: Create venv for IDA
      run: uv venv --seed $HOME/.idapro/venv

    - name: Register Python interpreter with IDA
      shell: bash
      run: |
        ${{ runner.temp }}/app/ida/${{ matrix.ida.idapyswitch }} \
          --force-path $( \
            uv run --python $HOME/.idapro/venv python -c \
              'import sys,sysconfig,pathlib;print(next(pathlib.Path(sysconfig.get_config_var("LIBDIR")).glob("libpython*")))' \
          )

    - name: Set IDAPYTHON_VENV_EXECUTABLE
      shell: bash
      run: |
        VENV_PYTHON="$(uv python find "$HOME/.idapro/venv")"
        echo "IDAPYTHON_VENV_EXECUTABLE=$VENV_PYTHON" >> "$GITHUB_ENV"

    - name: Run oplog tests
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      run: uv run --no-project python -m pytest plugins/oplog/tests/ -v
      env:
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
