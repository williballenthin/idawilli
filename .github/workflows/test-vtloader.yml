name: vtloader tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  vtloader-lint:
    name: vtloader lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: "3.12"

    # Pinned: an unpinned formatter turns this check red whenever ruff makes a
    # release, with no change to the code under test. Bump deliberately.
    - name: Check formatting
      run: uvx ruff@0.16.6 format --check plugins/vtloader

    - name: Check lints
      run: uvx ruff@0.16.6 check plugins/vtloader

    - name: Check plugin metadata
      run: uvx --from ida-hcli hcli plugin lint plugins/vtloader

  vtloader-unit-tests:
    name: vtloader unit tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv --seed
        uv pip install pytest

    # The tests that need IDA skip themselves when no installation is configured,
    # so this job covers the parts of vtloader that are pure Python.
    - name: Run tests that do not need IDA
      run: uv run --no-project python -m pytest plugins/vtloader/tests -v

  vtloader-idalib-tests:
    name: vtloader idalib tests on IDA ${{ matrix.ida-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Job level so that the `if` guards below see them: without a license the
    # IDA steps skip and the job still passes.
    env:
      HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
      IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        ida-version: ["9.2", "latest"]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv --seed
        uv pip install idapro ida-settings pytest

    - name: Install IDA ${{ matrix.ida-version }}
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      shell: bash
      run: |
        uv run --with ida-hcli hcli \
          ida install \
          --download-id "ida-pro:${{ matrix.ida-version }}" \
          --license-id "${IDA_LICENSE_ID}" \
          --install-dir="${{ runner.temp }}/app/ida" \
          --accept-eula \
          --set-default \
          --yes

    # The loaders run inside IDA, so these exercise the plugin end to end through
    # idalib. The live VirusTotal tests additionally need VT_API_KEY and skip without it.
    - name: Run idalib tests
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      run: uv run --no-project python -m pytest plugins/vtloader/tests -v
      env:
        IDADIR: ${{ runner.temp }}/app/ida
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
