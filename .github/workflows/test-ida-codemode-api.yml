name: ida-codemode-api checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  ida-codemode-api-tests:
    name: ida-codemode-api checks on IDA ${{ matrix.ida.version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        ida:
          - version: "9.2"
          - version: "latest"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: "ida-codemode/uv.lock"
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Create test environment
      run: |
        uv venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Install Python dependencies
      run: |
        uv pip install idapro ida-domain pytest
        uv pip install --editable ida-codemode/packages/ida-codemode-api

    - name: Rebuild ida-codemode-api reference docs
      working-directory: ida-codemode/packages/ida-codemode-api
      run: |
        PYTHONPATH=. python -c 'from pathlib import Path; from ida_codemode_api.api import api_reference; text = api_reference() + "\n"; Path("ida_codemode_api/prompts/api_reference.md").write_text(text + "\n<!--- (autogenerated file: do not edit) -->\n", encoding="utf-8");'

    - name: Lint ida-codemode-api
      working-directory: ida-codemode/packages/ida-codemode-api
      run: |
        uvx ruff check .
        uvx ty check ida_codemode_api tests

    - name: Install IDA ${{ matrix.ida.version }}
      shell: bash
      run: |
        uv run --with ida-hcli hcli \
          ida install \
          --download-id "ida-pro:${{ matrix.ida.version }}" \
          --license-id "${IDA_LICENSE_ID}" \
          --install-dir="${{ runner.temp }}/app/ida" \
          --accept-eula \
          --set-default \
          --yes
      env:
        HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

    - name: Run ida-codemode-api tests
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      working-directory: ida-codemode/packages/ida-codemode-api
      run: PYTHONPATH=. python -m pytest tests -v
      env:
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
