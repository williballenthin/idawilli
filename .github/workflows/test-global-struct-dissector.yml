name: global struct dissector tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  global-struct-dissector-tests:
    name: global struct dissector tests on IDA ${{ matrix.ida.version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        ida:
          - version: "9.2"
          - version: "latest"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        version: "0.12.6"
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: uv pip install --system idapro ida-domain pytest

    - name: Install IDA ${{ matrix.ida.version }}
      shell: bash
      run: |
        uv run --with ida-hcli hcli \
          ida install \
          --download-id "ida-pro:${{ matrix.ida.version }}" \
          --license-id "${IDA_LICENSE_ID}" \
          --install-dir="${{ runner.temp }}/app/ida" \
          --accept-eula \
          --set-default \
          --yes
      env:
        HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

    - name: Run global struct dissector tests
      if: ${{ env.IDA_LICENSE_ID != 0 }}
      run: python -m pytest plugins/global_struct_dissector/tests/ -v
      env:
        IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
